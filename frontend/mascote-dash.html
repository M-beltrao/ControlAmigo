<div class="mascote-wrapper">

    <div class="mascote-balao" id="mascoteBalao">

        <button
            class="mascote-fechar"
            id="mascoteFechar"
            type="button"
            aria-label="Fechar mensagem"
        >
            ×
        </button>

        <strong id="mascoteTitulo">
            Ei! 👋
        </strong>

        <p id="mascoteMensagem">
            Estou aqui para te ajudar a cuidar das suas finanças.
        </p>

    </div>

    <button
        class="mascote-carteira"
        id="mascoteCarteira"
        type="button"
        aria-label="Abrir assistente financeiro"
    >

        <div class="carteira-cartoes">

            <span class="cartao cartao-verde"></span>

            <span class="cartao cartao-azul"></span>

            <span class="cartao cartao-amarelo"></span>

        </div>

        <div class="carteira-corpo">

            <div class="carteira-costura"></div>

            <div class="carteira-rosto">

                <span class="olho olho-esquerdo"></span>

                <span class="olho olho-direito"></span>

                <span class="bochecha bochecha-esquerda"></span>

                <span class="bochecha bochecha-direita"></span>

                <span class="boca"></span>

            </div>

            <div class="carteira-fecho">

                <span class="botao-fecho"></span>

            </div>

            <span class="braco braco-esquerdo"></span>

            <span class="braco braco-direito"></span>

            <span class="perna perna-esquerda"></span>

            <span class="perna perna-direita"></span>

        </div>

    </button>

</div>
